<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="YouScope home">
      <span class="y">Y</span>ou<span class="s">S</span>cope
    </a>
    <div class="header-actions">
      <a class="ghost-link" href="{{ site.repo_url }}" target="_blank" rel="noopener">GitHub</a>

        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"

          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>
  </div>
