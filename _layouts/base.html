<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
  <a class="skip" href="#main">Skip to content</a>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <div class="page">
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/backdrop.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
