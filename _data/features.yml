- id: microplate-editor
  category: Acquisition
  name: Microplate &amp; chip editor
  lede: Turn any layout into a position map you can loop over.
  body: >-
    Draw a standard microplate or a custom microfluidic chip, place wells,
    chambers and features by hand or from a template, and assign imaging
    positions visually. YouScope turns the drawing into a coordinate map your
    protocol iterates over. The days of time-consuming, hand-typed stage positions are over.
  shot: wide
  coord: "572 wells · A1–K36"
  size: large
  image: "/assets/img/capabilities/ys-came-cc-m.png"

- id: smart-microscopy
  category: Analysis
  name: Smart microscopy
  lede: Acquisition that reacts to what it sees.
  body: >-
    Close the loop between imaging and analysis. Modular segmenters find your
    objects, quantifiers measure what matters, trackers follow them through time. Results feed back to drive the next acquisition. Mix the
    built-in modules or drop in your own segmenter, quantifier or tracker.
  shot: wide
  coord: "segment · quantify · track"
  size: medium
  image: "/assets/img/capabilities/ys-cellpose-livecell-detection.png"


- id: scripting-console
  category: Scripting
  name: Scripting &amp; environments
  lede: Automate any protocol, in the language you already use.
  body: >-
    One console drives it all. Write in modern Python, legacy Jython, MATLAB or
    JavaScript. YouScope tracks the environment each script
    runs in, so native and e.g. Cython-backed packages like NumPy or TensorFlow sit
    right inside your acquisition logic.
  shot: closeup
  coord: "python · matlab · js"
  size: medium
  image: "/assets/img/capabilities/ys-scripting-console-python-napari.png"

- id: argolight-calibration
  category: Calibration
  name: Argolight calibration
  lede: Calibrate your optical system, and track its performance over time.
  body: >-
    Run your Argolight reference patterns and turn them into quantitative
    checks with all aquisition settings generated automatically. For example field illumination, distortion and stage
    accuracy. To ensure today's images stay comparable to last month's.
  shot: closeup
  coord: "QC · Δλ registration"
  size: medium
  image: "/assets/img/capabilities/ys-microscope-calibration-argolight.png"

- id: fair-export
  category: Data
  name: FAIR export
  lede: Turn experiments into archives others can actually reuse.
  body: >-
    Export legacy and current projects to open, standard formats such as OME-TIFF,
    OME-Zarr and RO-Crates. Images, metadata and provenance
    travel together, FAIR by default.
  shot: wide
  coord: "OME-Zarr · OME-TIFF · RO-Crate "
  size: half
  image: "/assets/img/capabilities/ys-fair-export.png"

