- id: llm
  category: AI
  name: YouScope AI assistant
  lede: Configure complex protocols with YouScope's AI assistant faster.
  body: >-
    Configure complex protocols with help from an AI assistant. Connect YouScope to an LLM through an API and use it to configure your optical system, set up attached devices and build measurement protocols. The assistant helps turn what you want to measure into a protocol you can run in YouScope reproducibly. 
  shot: closeup
  coord: "llm · assistant · reproducible protocols"
  size: half
  image: "/assets/img/capabilities/ys-ai-assistant.png"